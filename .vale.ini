StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = https://github.com/OR13/ietf-vale/releases/download/v0.4.6/IETF-Draft.zip, \
           https://github.com/OR13/ietf-vale/releases/download/v0.4.6/IETF-Draft-Optional.zip
Vocab = Agent

[*.md]
BasedOnStyles = Vale, IETF-Draft, IETF-Draft-Optional

[draft-steele-agent-considerations.md]
# RFC XML macros contain uppercase identifiers that are not prose abbreviations.
IETF-Draft.Abbreviations = NO
# The source uses the RFCXML BCP 14 boilerplate macro, which Vale cannot expand.
IETF-Draft.Bcp14Boilerplate = NO
